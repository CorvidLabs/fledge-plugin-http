name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15]
        swift: ["6.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Verify binary runs
        run: |
          INIT='{"type":"init","protocol":"fledge-v1","args":["--url","http://169.254.169.254/latest/meta-data"],"project":null,"plugin":{"name":"fledge-plugin-http","version":"0.1.0","dir":"."},"fledge":{"version":"1.5.0"}}'
          ln -sf "$(pwd)/.build/release/fledge-http" /tmp/fledge-http-request
          OUTPUT=$(echo "$INIT" | /tmp/fledge-http-request 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "blocked" || (echo "SSRF guard did not fire" && exit 1)
